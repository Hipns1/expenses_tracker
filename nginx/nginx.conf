server {
    listen 3003;
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_body_timeout 60s;
    client_header_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         "upgrade";
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

    proxy_connect_timeout 60s;
    proxy_read_timeout    600s;
    send_timeout          600s;

    add_header X-Frame-Options      "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection     "1; mode=block";
    add_header Referrer-Policy      "no-referrer-when-downgrade";

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # API — proxy a los controladores del backend
    location ~* ^/invoice/(Auth|Invoices|Categories|Records|CardExpenses|CreditCards|FiscalYears|Module|Role)(/|$) {
        rewrite ^/invoice/(.*)$ /$1 break;
        proxy_pass http://expenses-backend:3013;
    }

    # SPA — sirve desde /invoice/
    location /invoice/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /invoice/index.html;
    }

    # Redirect raíz a /invoice/
    location = / {
        return 302 /invoice/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
