server {
    listen 84;
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_body_timeout 60s;
    client_header_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         "upgrade";
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

    proxy_connect_timeout 60s;
    proxy_read_timeout    600s;
    send_timeout          600s;

    add_header X-Frame-Options      "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection     "1; mode=block";
    add_header Referrer-Policy      "no-referrer-when-downgrade";

    # Evita redirects absolutos con http://host:84 cuando nginx está detrás de un proxy HTTPS
    absolute_redirect off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # API — proxy a los controladores del backend
    location ~* ^/invoice/(Auth|Invoices|Categories|Records|CardExpenses|CreditCards|FiscalYears|Module|Role|Loans|Budgets|Debts|RecurringExpenses)(/|$) {
        rewrite ^/invoice/(.*)$ /$1 break;
        proxy_pass http://expenses-backend:3013;
    }

    # SPA — sirve desde /invoice/
    # Los assets con hash (JS/CSS) se sirven directamente si existen; si no, cae a index.html
    location /invoice/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri /invoice/index.html;

        # Cachear agresivamente los assets con hash (el nombre cambia en cada build)
        location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html nunca se cachea → el browser siempre pide la versión fresca
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
    }

    # /invoice sin slash → redirect a /invoice/
    location = /invoice {
        return 301 /invoice/;
    }

    # Redirect raíz a /invoice/
    location = / {
        return 301 /invoice/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
